[project]
name = "unity-games-uploader"
version = "0.1.0"
description = "Backend service for upload and put into production the unity games"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.21",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "marimo>=0.18.4",
    "rich>=14.2.0",
]
